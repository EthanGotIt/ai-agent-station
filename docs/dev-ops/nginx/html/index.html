<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto Agent 智能体</title>
    <!-- Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=clash-display@600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="./js/tailwind-config.js"></script>
    <script src="./js/3.4.17.js"></script>
    <script src="./js/marked.min.js"></script>
    <script src="./js/purify.min.js"></script>
    <script src="./js/highlight.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="./css/github.min.css">
    <link rel="stylesheet" href="./css/css2.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body class="app-shell h-screen flex flex-col bg-background text-gray-800 font-sans selection:bg-primary-100 selection:text-primary-900">

<!-- Top Navigation -->
<nav class="px-6 py-4 flex items-center justify-between z-30 bg-white/80 backdrop-blur-md border-b border-border">
    <div class="flex items-center gap-4">
        <div class="w-10 h-10 border border-primary-200 rounded-xl flex items-center justify-center bg-primary-50 shadow-sm">
            <span class="text-primary-600 font-mono font-bold text-lg">AI</span>
        </div>
        <h1 class="text-2xl font-bold tracking-wide text-gray-900 font-display">Auto Agent<span class="text-primary-500">.</span></h1>
    </div>

    <div class="hidden md:flex items-center gap-3 px-4 py-1.5 border border-border bg-surface rounded-full text-sm font-mono shadow-sm">
        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse-slow"></span>
        <span class="text-gray-600 tracking-wide">系统在线</span>
        <span class="text-gray-400">v2.0</span>
    </div>

    <div class="flex items-center gap-3">
        <button id="newChatBtn" class="btn-outline px-4 py-2 font-mono text-sm tracking-wide flex items-center gap-2 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            新建对话
        </button>
        <button id="clearAllChatsBtn" class="btn-outline px-4 py-2 font-mono text-sm tracking-wide text-red-500 hover:bg-red-50 hover:text-red-600 hover:border-red-200 flex items-center gap-2 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
            清空历史
        </button>
    </div>
</nav>

<div class="flex-1 flex overflow-hidden p-4 gap-4 pt-4">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 panel-border bg-white rounded-2xl flex flex-col overflow-hidden shadow-sm transition-all duration-300">
        <div class="p-4 border-b border-border bg-gray-50/50">
            <h2 class="font-mono text-sm text-gray-600 font-semibold tracking-wide flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                </svg>
                对话历史
            </h2>
        </div>
        <div class="flex-1 overflow-y-auto custom-scrollbar p-2">
            <ul id="chatList" class="space-y-1 font-mono text-sm">
                <!-- Chat history list -->
            </ul>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col gap-4 overflow-hidden">
        <!-- Dual Panel -->
        <div class="flex-1 flex gap-4 overflow-hidden">
            <!-- Process Panel -->
            <div class="w-1/2 panel-border bg-white rounded-2xl flex flex-col shadow-sm relative group overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-accent-400/20 group-hover:bg-accent-400 transition-colors"></div>
                <div class="px-4 py-3 border-b border-border bg-gray-50/50 flex justify-between items-center">
                    <h3 class="font-mono text-sm text-gray-700 font-semibold tracking-wide flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-accent-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                        </svg>
                        智能体思考执行过程
                    </h3>
                    <span class="w-2 h-2 rounded-full bg-accent-400 animate-pulse"></span>
                </div>
                <div id="thinkingMessages" class="flex-1 overflow-y-auto p-5 space-y-5 custom-scrollbar">
                    <div class="flex items-start gap-4 message">
                        <div class="w-8 h-8 rounded-full border border-accent-200 bg-accent-50 flex items-center justify-center flex-shrink-0 text-accent-600 font-mono text-xs font-bold shadow-sm">
                            SYS
                        </div>
                        <div class="flex-1 bg-gray-50 border border-gray-100 rounded-xl p-4 text-sm text-gray-600 font-mono shadow-sm">
                            智能体进程已初始化，等待输入指令...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Result Panel -->
            <div class="w-1/2 panel-border bg-white rounded-2xl flex flex-col shadow-sm relative group overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-primary-400/20 group-hover:bg-primary-400 transition-colors"></div>
                <div class="px-4 py-3 border-b border-border bg-gray-50/50 flex justify-between items-center">
                    <h3 class="font-mono text-sm text-gray-700 font-semibold tracking-wide flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        最终执行结果
                    </h3>
                    <span class="w-2 h-2 rounded-full bg-primary-400 animate-pulse"></span>
                </div>
                <div id="resultMessages" class="flex-1 overflow-y-auto p-5 space-y-5 custom-scrollbar">
                    <div class="flex items-start gap-4 message">
                        <div class="w-8 h-8 rounded-full border border-primary-200 bg-primary-50 flex items-center justify-center flex-shrink-0 text-primary-600 font-mono text-xs font-bold shadow-sm">
                            OUT
                        </div>
                        <div class="flex-1 bg-gray-50 border border-gray-100 rounded-xl p-4 text-sm text-gray-600 shadow-sm">
                            执行完成后的结果将在此处展示。
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Composer Panel -->
        <div class="composer-panel p-5 flex flex-col gap-4 relative rounded-2xl bg-white shadow-sm border border-border">
            <!-- Loading Overlay -->
            <div id="loading" class="hidden absolute inset-0 z-20 bg-white/80 backdrop-blur-sm flex items-center justify-center rounded-2xl">
                <div class="flex flex-col items-center gap-3">
                    <div class="w-10 h-10 border-2 border-primary-100 border-t-primary-500 rounded-full animate-spin"></div>
                    <span class="font-mono text-primary-600 text-sm font-medium tracking-wide animate-pulse">智能体正在思考中...</span>
                </div>
            </div>

            <!-- Top Config Row -->
            <div class="flex gap-6 items-start flex-col lg:flex-row">
                <!-- Agent Grid -->
                <div class="flex-1 w-full">
                    <div class="font-mono text-xs text-gray-500 mb-2 font-semibold tracking-wide">选择智能体模式</div>
                    <div id="agentCardContainer" class="agent-card-grid"></div>
                </div>

                <!-- Tools & Settings -->
                <div class="w-full lg:w-1/3 flex flex-col gap-3">
                    <div class="font-mono text-xs text-gray-500 font-semibold tracking-wide">任务配置</div>
                    
                    <div class="case-picker relative w-full">
                        <button id="caseDropdownButton" class="w-full flex items-center justify-between px-3 py-2.5 border border-border bg-gray-50 hover:bg-gray-100 transition-colors text-gray-700 font-sans text-sm rounded-lg shadow-sm">
                            <div class="flex items-center min-w-0">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span class="case-dropdown-label truncate">加载快捷案例...</span>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div id="caseDropdown" class="case-dropdown-panel absolute z-50 w-full mt-1 hidden max-h-48 overflow-y-auto custom-scrollbar rounded-lg border border-border shadow-lg bg-white">
                            <div id="dropdownCaseContainer" class="p-1">
                                <div id="dropdown-default-message" class="text-center py-3 text-gray-500 text-xs font-mono">
                                    请先选择智能体
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between border border-border bg-gray-50 px-3 py-2 rounded-lg shadow-sm">
                        <span class="font-mono text-xs text-gray-600 font-medium">最大执行步数</span>
                        <div class="flex gap-1 bg-gray-200/50 p-1 rounded-md">
                            <div class="px-2.5 py-1 text-xs font-mono cursor-pointer text-gray-500 hover:text-gray-900 rounded transition-colors step-button" data-step="1">1</div>
                            <div class="px-2.5 py-1 text-xs font-mono cursor-pointer text-gray-500 hover:text-gray-900 rounded transition-colors step-button" data-step="2">2</div>
                            <div class="px-2.5 py-1 bg-white shadow-sm text-primary-600 text-xs font-mono font-bold cursor-pointer rounded transition-all step-button selected" data-step="3">3</div>
                            <div class="px-2.5 py-1 text-xs font-mono cursor-pointer text-gray-500 hover:text-gray-900 rounded transition-colors step-button" data-step="5">5</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Row -->
            <div class="flex gap-3 mt-2">
                <input type="text" id="messageInput" placeholder="输入您的问题或任务指令..." maxlength="1000"
                       class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 font-sans text-sm focus:border-primary-400 focus:ring-2 focus:ring-primary-100 focus:bg-white outline-none transition-all shadow-sm">
                <button id="sendBtn" onclick="sendMessage()"
                        class="btn-primary px-8 py-3 rounded-xl font-medium text-sm tracking-wide flex items-center gap-2 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    发送指令
                </button>
            </div>
            
            <!-- Session Status -->
            <div class="absolute bottom-1 right-5 text-[10px] font-mono text-gray-400">
                Session: <span id="sessionId" class="text-gray-500">WAITING</span>
            </div>
        </div>
    </div>
</div>

<script src="./js/main.js"></script>
</body>
</html>

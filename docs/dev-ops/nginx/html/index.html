<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Station</title>

    <script src="./js/tailwind-config.js"></script>
    <script src="./js/3.4.17.js"></script>
    <script src="./js/marked.min.js"></script>
    <script src="./js/purify.min.js"></script>
    <script src="./js/highlight.min.js"></script>

    <link rel="stylesheet" href="./css/github.min.css">
    <link rel="stylesheet" href="./css/css2.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="console-shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">GR</div>
            <div>
                <h1>AI Agent Station</h1>
                <p>GraphRuntime · MCP · RAG</p>
            </div>
        </div>

        <div class="top-status">
            <span class="live-dot"></span>
            <span>服务在线</span>
            <span>受控执行图</span>
        </div>

        <div class="top-actions">
            <button id="newChatBtn" class="icon-button" title="新建对话" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>新建</span>
            </button>
            <button id="clearAllChatsBtn" class="icon-button danger" title="清空历史" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>
                </svg>
                <span>清空</span>
            </button>
        </div>
    </header>

    <main class="workspace">
        <aside id="sidebar" class="history-pane">
            <div class="pane-title">
                <span>会话历史</span>
                <small>Local</small>
            </div>
            <ul id="chatList" class="history-list custom-scrollbar"></ul>
        </aside>

        <section class="run-pane">
            <div class="run-grid">
                <section class="stream-panel process-panel">
                    <div class="panel-heading">
                        <div>
                            <span class="eyebrow">Trace</span>
                            <h2>运行事件</h2>
                        </div>
                        <span class="panel-state active">监听中</span>
                    </div>
                    <div id="thinkingMessages" class="message-feed custom-scrollbar">
                        <div class="message">
                            <div class="message-avatar">SYS</div>
                            <div class="message-body">
                                <div class="message-kicker">系统状态</div>
                                <div>编排引擎已就绪，等待任务输入。</div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="stream-panel result-panel">
                    <div class="panel-heading">
                        <div>
                            <span class="eyebrow">Output</span>
                            <h2>最终结果</h2>
                        </div>
                        <span class="panel-state">待输出</span>
                    </div>
                    <div id="resultMessages" class="message-feed custom-scrollbar">
                        <div class="message">
                            <div class="message-avatar output">OUT</div>
                            <div class="message-body">
                                <div class="message-kicker">结果区</div>
                                <div>总结、结论和完成状态会在这里展示。</div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <section class="composer-panel">
                <div id="loading" class="loading-overlay hidden">
                    <div class="loader"></div>
                    <span>智能体正在编排任务</span>
                </div>

                <section class="command-panel">
                    <div class="command-agent">
                        <div class="section-label">智能编排入口</div>
                        <div id="agentCardContainer" class="agent-card-grid"></div>
                        <div id="agentOverview" class="agent-overview"></div>
                    </div>

                    <div class="run-config">
                        <div class="run-config-title">
                            <span>任务配置</span>
                            <small>案例 / 步数</small>
                        </div>
                        <div class="case-picker">
                            <button id="caseDropdownButton" class="select-button" type="button">
                                <span class="case-dropdown-label">选择案例</span>
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="m6 9 6 6 6-6"/>
                                </svg>
                            </button>
                            <div id="caseDropdown" class="case-dropdown-panel hidden">
                                <div id="dropdownCaseContainer">
                                    <div id="dropdown-default-message">请先选择智能体</div>
                                </div>
                            </div>
                        </div>

                        <div class="step-control">
                            <span>计划步数</span>
                            <div class="step-options">
                                <button class="step-button" data-step="1" type="button">1</button>
                                <button class="step-button" data-step="2" type="button">2</button>
                                <button class="step-button selected" data-step="3" type="button">3</button>
                                <button class="step-button" data-step="5" type="button">5</button>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="prompt-row">
                    <input type="text" id="messageInput" placeholder="输入任务，例如：检索 Spring AI 资料并整理落地建议" maxlength="1000">
                    <button id="sendBtn" class="send-button" onclick="sendMessage()" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h13M13 6l6 6-6 6"/>
                        </svg>
                        <span>执行</span>
                    </button>
                </div>

                <div class="session-line">
                    <span>会话</span>
                    <strong id="sessionId">等待中</strong>
                </div>
            </section>
        </section>
    </main>
</div>

<script src="./js/main.js"></script>
</body>
</html>

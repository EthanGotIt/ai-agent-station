<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto Agent - By Ethan</title>
    <script src="./js/3.4.17.js"></script>
    <script src="./js/marked.min.js"></script>
    <script src="./js/purify.min.js"></script>
    <script src="./js/highlight.min.js"></script>
    <link rel="stylesheet" href="./css/github.min.css">
    <link rel="stylesheet" href="./css/css2.css">
    <link rel="stylesheet" href="./css/main.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen flex flex-col bg-gray-50 font-sans">
<!-- Top Navigation -->
<nav class="border-b bg-white px-4 py-3 flex items-center gap-3 shadow-sm sticky top-0 z-30">
    <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
                <span class="text-white font-bold text-sm">🤖</span>
            </div>
            <h1 class="text-xl font-bold text-gray-800">Auto AI Agent By Ethan</h1>
        </div>
    </div>

    <div class="flex-1 flex items-center justify-center">
        <div class="flex items-center gap-3 text-gray-600">
            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <span class="font-medium">全自动智能对话助手 - 实时流式交互体验</span>
            <span class="text-xl">🐏</span>
        </div>
    </div>

    <div class="flex items-center gap-2">
        <button id="newChatBtn" class="flex items-center gap-1 px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            新建对话
        </button>

        <button id="clearAllChatsBtn" class="flex items-center gap-1 px-3 py-2 text-sm font-medium text-red-600 bg-white border border-red-300 rounded-lg hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
            清空对话
        </button>
    </div>
</nav>

<div class="flex-1 flex overflow-hidden">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="w-64 bg-white border-r overflow-y-auto transition-all duration-300 ease-in-out shadow-sm custom-scrollbar">
        <div class="p-4">
            <h2 class="font-bold mb-3 text-lg text-gray-800 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
                对话历史
            </h2>
            <ul id="chatList" class="space-y-2">
                <!-- 对话历史列表 -->
            </ul>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden bg-gray-50">
        <!-- 双面板内容区域 -->
        <div class="flex-1 flex overflow-hidden">
            <!-- 左侧思考过程面板 -->
            <div class="w-1/2 flex flex-col border-r border-gray-200 bg-white panel-shell">
                <div class="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center gap-2 panel-heading">
                    <span class="text-lg">🧠</span>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-semibold text-gray-800">AI思考执行过程</h3>
                        <p class="panel-subtitle">展示分析、执行、监督等实时步骤</p>
                    </div>
                </div>
                <div id="thinkingMessages" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 bg-primary-600 rounded-full flex items-center justify-center flex-shrink-0">
                            <span class="text-white text-sm font-semibold">AI</span>
                        </div>
                        <div class="flex-1 bg-primary-50 rounded-lg p-3">
                            <div class="text-sm text-primary-800">
                                <strong>AI助手:</strong> 您好！我是Auto AI Agent智能对话助手，请在右侧输入您的问题，我将在这里展示思考和执行过程。
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧结果面板 -->
            <div class="w-1/2 flex flex-col bg-white panel-shell result-panel">
                <div class="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center gap-3 panel-heading result-panel-heading">
                    <span class="text-lg">📋</span>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-semibold text-gray-800">最终执行结果</h3>
                        <p class="panel-subtitle">聚合最终结论、执行产出和完成状态</p>
                    </div>
                    <span id="resultStatus" class="result-status-chip">等待结果</span>
                    <button id="copyResultBtn" type="button" class="result-copy-btn" disabled>复制结果</button>
                </div>
                <div id="resultMessages" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar result-panel-body">
                    <div id="resultEmptyState" class="result-empty-state">
                        <div class="result-empty-icon">✨</div>
                        <div class="result-empty-title">结果区已就绪</div>
                        <div class="result-empty-text">执行完成后，这里会优先展示最终结论、执行结果和总结内容，方便直接复制与复核。</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部输入区域 -->
        <div class="border-t border-gray-200 bg-white p-4">
            <!-- 加载状态 -->
            <div id="loading" class="hidden text-center py-2 text-primary-600">
                <div class="flex items-center justify-center gap-2">
                    <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="font-medium">AI正在思考中，请稍候...</span>
                </div>
            </div>

            <!-- 控制面板 -->
            <div class="mb-4 flex flex-wrap items-center gap-4 p-3 bg-gray-50 rounded-lg">
                <div class="flex items-center gap-2">
                    <label for="aiAgentSelect" class="text-sm font-medium text-gray-700">智能体类型</label>
                    <select id="aiAgentSelect" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-300 focus:border-primary-500 outline-none transition-all duration-200">
                        <option value="3">Auto Agent - By GLM-5</option>
                        <option value="4">Auto Agent - By Kimi-K2.5</option>
                        <option value="5">Auto Agent - By Qwen3.5-Plus</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <label for="maxStepSelect" class="text-sm font-medium text-gray-700">最大执行步数</label>
                    <select id="maxStepSelect" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-300 focus:border-primary-500 outline-none transition-all duration-200">
                        <option value="1">1步</option>
                        <option value="2">2步</option>
                        <option value="3" selected>3步</option>
                        <option value="5">5步</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <label for="exampleSelect" class="text-sm font-medium text-gray-700">提问案例</label>
                    <select id="exampleSelect" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-300 focus:border-primary-500 outline-none transition-all duration-200">
                        <option value="">请选择提问案例...</option>
                        <option value="1 + 1 = ?">案例1；1 + 1 = ?</option>
                        <option value="通过ES查询被限流的用户，给出被限流用户列表">案例2；通过ES查询被限流的用户，给出被限流用户列表</option>
                        <option value="通过浏览器检索小傅哥的相关项目，列出一份学习计划">案例3；通过浏览器检索小傅哥的相关项目，列出一份学习计划</option>
                        <option value="根据当前北京互联网程序员加班情况、收入、公司文化等，列出一份大学生推荐入职单位">案例4；根据当前北京互联网程序员加班情况、收入、公司文化等，列出一份大学生推荐入职单位</option>
                    </select>
                </div>
            </div>

            <!-- 输入框和发送按钮 -->
            <div class="flex gap-3">
                <input type="text" id="messageInput" placeholder="请输入您的问题..." maxlength="1000"
                       class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-300 focus:border-primary-500 outline-none transition-all duration-200 text-gray-700 placeholder-gray-400">
                <button id="sendBtn" onclick="sendMessage()"
                        class="px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors duration-200 font-medium flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    发送
                </button>
            </div>

            <!-- 会话状态 -->
            <div class="mt-3 text-center">
                <div class="text-xs text-gray-500">
                    会话ID: <span id="sessionId" class="font-mono"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="./js/main.js"></script>
</body>
</html>

# 命令执行 docker-compose -f docker-compose-environment.yml up -d

services:
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/mysql.cnf:ro
      - ./mysql/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - network

  redis:
    image: redis:6.2
    container_name: redis
    restart: always
    profiles: ["extras"]
    hostname: redis
    privileged: true
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: always
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: always
    profiles: ["tools", "extras"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - network

networks:
  network:
    external: true

volumes:
  mysql_data:
    external: true
  redis_data:
    external: true
  pgvector_data:
    external: true
  cloudbeaver_data:
    external: true
  redisinsight_data:
    external: true

# 命令执行 docker-compose -f docker-compose-environment-pgvector.yml up -d

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai-agent-station
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./pgvector/sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai-agent-station"]
      interval: 5s
      timeout: 20s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - network

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: always
    profiles: ["tools"]
    depends_on:
      pgvector:
        condition: service_healthy
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - network

networks:
  network:
    external: true

volumes:
  pgvector_data:
    external: true
  cloudbeaver_data:
    external: true

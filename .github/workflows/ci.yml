name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python convention and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check patch whitespace
        run: git diff --check
      - name: Run repository convention check
        run: python -m scripts.convention_check
      - name: Run Python unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  maven:
    name: Maven unit, integration, and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B -DskipTests=false clean test
      - name: Run integration tests
        run: mvn -B verify
      - name: Analyze dependencies
        run: mvn -B dependency:analyze -DskipTests

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-fronted
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent-fronted/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run Vitest suite
        run: npm test -- --run
      - name: Run component tests
        run: npm run test:component
      - name: Build production bundle
        run: npm run build

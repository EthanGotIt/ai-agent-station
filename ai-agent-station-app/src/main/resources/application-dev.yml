server:
  port: 8090

thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

spring:
  datasource:
    mysql:
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:123456}
      url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ai-agent-station?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 15
        idle-timeout: 30000
        maximum-pool-size: 25
        max-lifetime: 1800000
        connection-timeout: 30000
    pgvector:
      username: ${PGVECTOR_USERNAME:postgres}
      password: ${PGVECTOR_PASSWORD:postgres}
      url: ${PGVECTOR_URL:jdbc:postgresql://127.0.0.1:5432/ai-agent-station}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        idle-timeout: 30000
        connection-timeout: 30000
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:none}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1536
    agent:
      auto-config:
        enabled: true
        client-ids: 2101,2102,2103

ai-agent:
  vector-store:
    enabled: ${AI_AGENT_VECTOR_STORE_ENABLED:false}

logging:
  level:
    root: info
  config: classpath:logback-spring.xml

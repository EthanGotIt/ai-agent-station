server:
  port: 8090

thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

spring:
  datasource:
    mysql:
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:123456}
      url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ai-agent-station?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 15
        idle-timeout: 30000
        maximum-pool-size: 25
        max-lifetime: 1800000
        connection-timeout: 30000
    pgvector:
      username: ${PGVECTOR_USERNAME:postgres}
      password: ${PGVECTOR_PASSWORD:postgres}
      url: ${PGVECTOR_URL:jdbc:postgresql://127.0.0.1:5432/ai-agent-station}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        idle-timeout: 30000
        connection-timeout: 30000
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:none}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${OPENAI_API_KEY:}
    agent:
      auto-config:
        enabled: ${AI_AGENT_AUTO_CONFIG_ENABLED:true}
        client-ids: 2103

ai-agent:
  graph:
    checkpoint:
      enabled: ${AI_AGENT_GRAPH_CHECKPOINT_ENABLED:true}
      initialize-schema: ${AI_AGENT_GRAPH_CHECKPOINT_INITIALIZE_SCHEMA:true}
    summarization:
      max-tokens-before-summary: ${AI_AGENT_GRAPH_SUMMARY_MAX_TOKENS:6000}
      messages-to-keep: ${AI_AGENT_GRAPH_SUMMARY_MESSAGES_TO_KEEP:6}
      chars-per-token: ${AI_AGENT_GRAPH_SUMMARY_CHARS_PER_TOKEN:4}
  mcp:
    prewarm-enabled: ${AI_AGENT_MCP_PREWARM_ENABLED:true}
    prewarm-concurrency: ${AI_AGENT_MCP_PREWARM_CONCURRENCY:4}
    resolve-timeout-seconds: ${AI_AGENT_MCP_RESOLVE_TIMEOUT_SECONDS:5}
  vector-store:
    enabled: ${AI_AGENT_VECTOR_STORE_ENABLED:false}
    base-url: ${AI_AGENT_VECTOR_STORE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_AGENT_VECTOR_STORE_MODEL:text-embedding-v4}
    dimensions: ${AI_AGENT_VECTOR_STORE_DIMENSIONS:1024}
  hybrid-retrieval:
    es-base-url: ${AI_AGENT_ES_BASE_URL:http://127.0.0.1:9200}
    es-index-name: ${AI_AGENT_ES_INDEX_NAME:ai_rag_chunk}
    es-template-name: ${AI_AGENT_ES_TEMPLATE_NAME:ai_rag_chunk_template}
    initialize-es-on-startup: ${AI_AGENT_ES_INIT_ON_STARTUP:true}
    vector-route-top-k: ${AI_AGENT_VECTOR_ROUTE_TOP_K:12}
    bm25-route-top-k: ${AI_AGENT_BM25_ROUTE_TOP_K:12}
    rrf-rank-constant: ${AI_AGENT_RRF_RANK_CONSTANT:60}
    small-to-big-enabled: ${AI_AGENT_SMALL_TO_BIG_ENABLED:true}
    http-timeout-millis: ${AI_AGENT_ES_HTTP_TIMEOUT_MILLIS:3000}

logging:
  level:
    root: info
  config: classpath:logback-spring.xml

management:
  endpoint:
    health:
      show-details: always

spring:
  datasource:
    mysql:
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:123456}
      url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/ai-agent-station?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 2
        idle-timeout: 30000
        maximum-pool-size: 10
        max-lifetime: 1800000
        connection-timeout: 30000
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:qwen3.7-plus}

ai-agent:
  after-sales:
    model-bean-name: ${AI_AGENT_AFTER_SALES_MODEL_BEAN_NAME:}
    commerce-adapter: ${AI_AGENT_AFTER_SALES_COMMERCE_ADAPTER:local}
    commerce-base-url: ${AI_AGENT_AFTER_SALES_COMMERCE_BASE_URL:http://127.0.0.1:18080}
    commerce-timeout: ${AI_AGENT_AFTER_SALES_COMMERCE_TIMEOUT:3s}
    outbox:
      scheduling-enabled: ${AI_AGENT_AFTER_SALES_OUTBOX_ENABLED:false}
      fixed-delay: ${AI_AGENT_AFTER_SALES_OUTBOX_FIXED_DELAY:1000}
      max-attempts: ${AI_AGENT_AFTER_SALES_OUTBOX_MAX_ATTEMPTS:5}
    fault-injection:
      enabled: ${AI_AGENT_AFTER_SALES_FAULT_ENABLED:false}
      mode: ${AI_AGENT_AFTER_SALES_FAULT_MODE:TIMEOUT}
      failure-count: ${AI_AGENT_AFTER_SALES_FAULT_COUNT:1}
